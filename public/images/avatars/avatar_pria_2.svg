  </defs>

  <!-- Background Circle -->
  <rect width="160" height="160" rx="80" fill="url(#bg_pria_2)"/>
  <circle cx="80" cy="80" r="78" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Body / Shoulders - Kemeja Putih Dinas BMKG dengan Pangkat / Epaulet -->
  <path d="M28 160 C30 125 50 114 80 114 C110 114 130 125 132 160 Z" fill="#f8fafc"/>
  <!-- Kerah Kemeja Putih -->
  <polygon points="66,114 80,126 74,138 60,122" fill="#e2e8f0"/>
  <polygon points="94,114 80,126 86,138 100,122" fill="#e2e8f0"/>
