  <!-- Telinga -->
  <circle cx="57" cy="74" r="5" fill="#e2b498"/>
  <circle cx="103" cy="74" r="5" fill="#e2b498"/>

  <!-- Rambut Modern Professional Neat Cut -->
  <path d="M57 66 C57 48 68 44 80 44 C93 44 103 48 103 66 C98 56 90 53 80 53 C69 53 62 57 57 66 Z" fill="#1e293b"/>
  <path d="M57 66 C59 55 68 50 80 50 C92 50 101 55 103 66 C99 60 92 57 80 57 C68 57 61 60 57 66 Z" fill="#334155"/>

