  <rect x="82" y="65" width="15" height="12" rx="3" stroke="#1e293b" stroke-width="1.8" fill="#ffffff" fill-opacity="0.2"/>
  <line x1="78" y1="70" x2="82" y2="70" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="58" y1="69" x2="63" y2="69" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="97" y1="69" x2="102" y2="69" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Mata di Balik Kacamata -->
  <circle cx="70.5" cy="71" r="2.2" fill="#0f172a"/>
  <circle cx="89.5" cy="71" r="2.2" fill="#0f172a"/>
  <circle cx="71.2" cy="70.3" r="0.7" fill="#ffffff"/>
  <circle cx="90.2" cy="70.3" r="0.7" fill="#ffffff"/>

