      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="skin_2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fae3d2"/>
      <stop offset="100%" stop-color="#e2b498"/>
